<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="t">
  <title id="t">Ilustração de uma tela de aplicativo com um cursor e anotações de pesquisa com usuários</title>
  <rect width="480" height="360" fill="#f3e9fd"/>
  <circle cx="400" cy="70" r="46" fill="#e2cdfb"/>
  <circle cx="70" cy="300" r="34" fill="#e2cdfb"/>
  <!-- Tela -->
  <rect x="110" y="60" width="260" height="200" rx="18" fill="#fff" stroke="#8b3fd9" stroke-width="4"/>
  <rect x="110" y="60" width="260" height="36" rx="18" fill="#8b3fd9"/>
  <rect x="110" y="80" width="260" height="16" fill="#8b3fd9"/>
  <circle cx="134" cy="78" r="6" fill="#fff" opacity=".8"/>
  <circle cx="154" cy="78" r="6" fill="#fff" opacity=".6"/>
  <circle cx="174" cy="78" r="6" fill="#fff" opacity=".4"/>
  <!-- Conteúdo da tela -->
  <rect x="134" y="116" width="120" height="14" rx="7" fill="#d9c2f7"/>
  <rect x="134" y="140" width="190" height="10" rx="5" fill="#ece1fb"/>
  <rect x="134" y="158" width="160" height="10" rx="5" fill="#ece1fb"/>
  <rect x="134" y="196" width="96" height="36" rx="12" fill="#8b3fd9"/>
  <rect x="242" y="196" width="96" height="36" rx="12" fill="none" stroke="#8b3fd9" stroke-width="3"/>
  <!-- Cursor -->
  <path d="M206 214 l0 46 l12 -12 l10 22 l10 -5 l-10 -21 l17 -1 z" fill="#1d1a2b" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
  <!-- Nota de pesquisa -->
  <g transform="rotate(-6 392 230)">
    <rect x="340" y="186" width="104" height="96" rx="10" fill="#ffd66b"/>
    <rect x="354" y="204" width="74" height="8" rx="4" fill="#c99a1b"/>
    <rect x="354" y="220" width="60" height="8" rx="4" fill="#c99a1b"/>
    <rect x="354" y="236" width="68" height="8" rx="4" fill="#c99a1b"/>
    <path d="M356 260 l8 8 l16 -16" fill="none" stroke="#0f9d6b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Usuária -->
  <circle cx="72" cy="150" r="22" fill="#8b3fd9"/>
  <path d="M34 232 a38 38 0 0 1 76 0 z" fill="#8b3fd9"/>
  <path d="M84 108 q14 -10 28 0" fill="none" stroke="#8b3fd9" stroke-width="4" stroke-linecap="round"/>
</svg>
